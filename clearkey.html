<!DOCTYPE html>
<html>
<head>
<title>ClearKey Bookmarklet</title>
</head>
<body>
<a href="javascript:(function(){try{var keys=null;if(typeof player!=='undefined'&&player.getClearKeys){keys=player.getClearKeys();}else{keys=[];var scripts=document.getElementsByTagName('script');for(var i=0;i<scripts.length;i++){var content=scripts[i].innerText;var match=content.match(/keys\s*:\s*(\[[^\]]+\])/);if(match){keys=JSON.parse(match[1]);break;}}}if(keys&&keys.length>0){alert('ClearKeys found:\\n'+JSON.stringify(keys,null,2));console.log(keys);}else{alert('No ClearKeys found on this page.');}}catch(e){alert('Error: '+e);}})();">Tap & Add Bookmark</a>
</body>
</html>
